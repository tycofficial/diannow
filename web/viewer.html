<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><title>远程电脑</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#080b11;color:#edf2ff}body{height:100dvh;display:flex;flex-direction:column;overflow:hidden}header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 14px;background:#151b28;flex:none}h1{font-size:15px;margin:0;font-weight:600}.status{font-size:11px;color:#aab8ce;margin-top:4px}button{font:inherit;font-size:12px;line-height:1.3;color:#e5edfc;background:#252e42;border:1px solid #3d4b68;border-radius:7px;padding:9px 11px;white-space:nowrap;cursor:pointer}button:disabled{opacity:.5;cursor:default}button[aria-pressed=true]{background:#3269be;border-color:#82afff}button:focus-visible,textarea:focus-visible{outline:2px solid #88b7ff;outline-offset:2px}#stop{color:#ffbec5;background:#39212c;border-color:#6e3d4e}nav{display:flex;gap:6px}main{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}video{width:100%;height:100%;object-fit:contain;display:block;touch-action:none;user-select:none}#overlay{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;text-align:center;background:rgba(8,11,17,.85);padding:24px;font-size:14px;line-height:1.8;pointer-events:none}#overlay:empty{display:none}#stats{padding:6px 12px;font-size:11px;color:#acbbd2;background:#101521;flex:none;font-variant-numeric:tabular-nums;min-height:25px}footer{background:#151b28;padding:8px 10px max(8px,env(safe-area-inset-bottom));flex:none}#tools{display:flex;gap:6px;overflow:auto}#tools button{min-width:43px}#keyboard{background:#3065b7;border-color:#6498ea}#keyboardbox{padding-top:8px;display:none}#keyboardbox.open{display:block}textarea{width:100%;min-height:52px;max-height:100px;border:1px solid #596b8e;border-radius:7px;background:#0c121e;color:#edf2ff;padding:9px;font-family:inherit;font-size:16px;resize:none}#keys{display:none;gap:6px;flex-wrap:wrap;padding-top:8px}#keys.open{display:flex}#inputHint{color:#aab8ce;font-size:11px;margin:6px 0 0}@media(max-width:400px){header{padding:8px 10px;gap:6px}button{padding:8px}h1{font-size:14px}}body:fullscreen header{display:none}body:fullscreen #stats{opacity:.8}
main,video{min-width:0;min-height:0}
button,textarea{border-radius:0!important;box-shadow:none!important}
header,footer,#stats{background:#1b1c1e}button,#keyboard{background:#2b2d30;border-color:#4b4d52}button[aria-pressed=true]{background:#53565c}nav{gap:4px}h1{font-weight:500}header{padding:8px 10px}#tools{gap:4px}#tools button{min-width:40px}textarea{min-height:40px}#notice{position:absolute;bottom:8px;left:12px;right:12px;pointer-events:none;text-align:center;font-size:12px;color:#eee;background:rgba(0,0,0,.72)}#notice:empty{display:none}
</style></head><body>
<header><div><h1>远程电脑</h1><div id="status" class="status" role="status">正在连接</div></div><nav><button id="audio">声音</button><button id="fullscreen">全屏</button><button id="connect">重连</button></nav></header>
<main><video id="screen" autoplay playsinline muted aria-label="远程电脑完整桌面，支持点击和拖动"></video><div id="overlay">正在建立视频连接…</div><div id="notice" role="status"></div></main>
<div id="stats">接收 — fps · 网络往返 — ms · 视频缓冲 — ms</div>
<footer><div id="tools"><button id="keyboard">键盘</button><button id="microphone">麦克风</button><button id="escape">Esc</button><button data-mod="Control" aria-pressed="false">Ctrl</button><button data-mod="Alt" aria-pressed="false">Alt</button><button data-mod="Shift" aria-pressed="false">Shift</button><button data-mod="Meta" aria-pressed="false">Win</button><button id="right">右键</button><button id="more">更多</button><button id="stop">断开</button></div>
<div id="keyboardbox"><textarea id="typing" aria-label="远程键盘输入" placeholder="在这里打字" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false"></textarea><p id="inputHint">轻点点击 · 单指滑动滚动 · 长按拖动</p></div>
<div id="keys"></div></footer>
<script>
//__GESTURES__
const video=document.getElementById('screen'),statusEl=document.getElementById('status'),overlay=document.getElementById('overlay'),statsEl=document.getElementById('stats'),typing=document.getElementById('typing');
let pc,control,motion,sessionId,connected=false,intentional=false,connecting=false,previousStats=null,lastFrame=0,pingRtt=0,sourceFps=0,held=new Set(),pointers=new Map(),mouseDown=false,lastY=0,composing=false,lastPoint={x:.5,y:.5},pendingMove=null,autoRetry,recoveryTimer;
let touchGestures,pendingWheel=null,remoteStream,microphoneSender,microphoneStream,microphoneReady=false,desktopAudioAvailable=false,inputId=0,moveSequence=0,noticeTimer;
function notice(message){document.getElementById('notice').textContent=message;clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>document.getElementById('notice').textContent='',4500)}
const iceServers=[{urls:'stun:stun.cloudflare.com:3478'}];
const signalingOrigin=location.hostname.endsWith('.github.io')?'https://desktop-live-tianw-1105.tyc130923.chatgpt.site':'';
function api(path,options={}){return fetch(signalingOrigin+path,{...options,credentials:'omit',referrerPolicy:'no-referrer'})}
function send(event,fast=false){const channel=fast?motion:control;if(event.type==='move')event.seq=++moveSequence;if(['key','text'].includes(event.type))event.id=++inputId;if(channel&&channel.readyState==='open'&&channel.bufferedAmount<65536){channel.send(JSON.stringify(event));return true}return false}
function release(){touchGestures?.cancel();if(mouseDown){send({type:'button',button:0,down:false});mouseDown=false}pointers.clear();pendingMove=null;pendingWheel=null;send({type:'release'})}
function clearModifiers(){held.clear();document.querySelectorAll('[data-mod]').forEach(button=>button.setAttribute('aria-pressed','false'))}
function key(name,modifiers=name==='Escape'?[]:[...held]){if(!send({type:'key',key:name,modifiers}))notice('输入通道尚未连接');clearModifiers()}
function text(value){if([...held].some(mod=>['Control','Alt','Meta'].includes(mod))&&/^[a-z0-9]+$/i.test(value)){for(const char of value)key(char)}else send({type:'text',text:held.has('Shift')?value.replace(/[a-z]/g,char=>char.toUpperCase()):value})}
async function closeConnection(){clearTimeout(recoveryTimer);release();connected=false;if(microphoneStream){microphoneStream.getTracks().forEach(track=>track.stop());microphoneStream=null}document.getElementById('microphone').setAttribute('aria-pressed','false');if(pc){const old=pc;pc=null;await old.close()}video.srcObject=null;remoteStream=null;previousStats=null}
function bindChannel(channel){channel.onmessage=event=>{try{const value=JSON.parse(event.data);if(value.type==='pong'){pingRtt=performance.now()-value.time;sourceFps=value.fps;microphoneReady=Boolean(value.microphoneReady);desktopAudioAvailable=Boolean(value.audio);if(value.inputError)notice(value.inputError)}else if(value.type==='inputAck'&&value.error)notice(value.error)}catch{}}}
async function connect(){
 if(connecting)return;connecting=true;intentional=false;clearTimeout(autoRetry);await closeConnection();overlay.textContent='正在建立加密视频连接…';statusEl.textContent='正在连接电脑…';
 try{
  pc=new RTCPeerConnection({iceServers,bundlePolicy:'max-bundle'});const active=pc;
  control=pc.createDataChannel('input',{ordered:true});motion=pc.createDataChannel('pointer',{ordered:false,maxRetransmits:0});bindChannel(control);bindChannel(motion);
  pc.addTransceiver('video',{direction:'recvonly'});
  microphoneSender=pc.addTransceiver('audio',{direction:'sendrecv'}).sender;remoteStream=new MediaStream();video.srcObject=remoteStream;
  pc.ontrack=event=>{remoteStream.addTrack(event.track);video.play().catch(()=>{});try{event.receiver.jitterBufferTarget=event.track.kind==='video'?60:40}catch{};try{event.receiver.playoutDelayHint=.05}catch{}};
  pc.onconnectionstatechange=()=>{
   if(pc!==active)return;const state=active.connectionState;connected=state==='connected';
   if(connected){clearTimeout(recoveryTimer);clearTimeout(autoRetry);statusEl.textContent='已连接 · 原始分辨率';overlay.textContent='';connecting=false;send({type:'release'})}
   else if(state==='disconnected'){
    release();statusEl.textContent='网络短时波动，正在恢复';
    clearTimeout(recoveryTimer);recoveryTimer=setTimeout(()=>{if(pc===active&&active.connectionState==='disconnected'&&!intentional){connecting=false;connect()}},12000);
   }else if(['failed','closed'].includes(state)){
    clearTimeout(recoveryTimer);release();statusEl.textContent='连接已断开';overlay.textContent=intentional?'连接已断开':'连接中断，正在重试…';connecting=false;
    if(!intentional){clearTimeout(autoRetry);autoRetry=setTimeout(connect,3000)}
   }
  };
  await pc.setLocalDescription(await pc.createOffer());
  await Promise.race([new Promise(resolve=>{if(active.iceGatheringState==='complete')resolve();else active.addEventListener('icegatheringstatechange',()=>{if(active.iceGatheringState==='complete')resolve()})}),new Promise(resolve=>setTimeout(resolve,5000))]);
  const offer=active.localDescription;
  const response=await api('/api/offer',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({sdp:offer.sdp,type:offer.type})});
  if(!response.ok)throw new Error('建立连接失败：HTTP '+response.status);
  const result=await response.json();
  if(result.sdp){await active.setRemoteDescription(result)}else{
   sessionId=result.id;const deadline=Date.now()+45000;let answered=false;
   while(Date.now()<deadline&&pc===active&&!intentional){
    const reply=await api('/api/answer/'+sessionId,{cache:'no-store'});
    if(reply.status===200){await active.setRemoteDescription(await reply.json());answered=true;break}
    if(![204,404].includes(reply.status))throw new Error('电脑连接失败：HTTP '+reply.status);
    await new Promise(resolve=>setTimeout(resolve,350));
   }
   if(!answered)throw new Error('电脑端未响应，请确认连接程序正在运行');
  }
  setTimeout(()=>{if(pc===active&&!connected&&!intentional){overlay.textContent='网络直连尚未成功。可重试；受限网络需要中继服务。';statusEl.textContent='等待网络连通';connecting=false}},18000);
 }catch(error){statusEl.textContent='连接失败';overlay.textContent=error.message;connecting=false}
}
function point(event){const bounds=video.getBoundingClientRect(),vw=video.videoWidth||1280,vh=video.videoHeight||720,scale=Math.min(bounds.width/vw,bounds.height/vh),w=vw*scale,h=vh*scale;return{x:Math.max(0,Math.min(1,(event.clientX-bounds.left-(bounds.width-w)/2)/w)),y:Math.max(0,Math.min(1,(event.clientY-bounds.top-(bounds.height-h)/2)/h))}}
touchGestures=new TouchGestures({point,emit:event=>{if(event.type==='wheel'){pendingWheel={...event,delta:Math.max(-1200,Math.min(1200,(pendingWheel?.delta||0)+event.delta))}}else send(event)}});
video.onpointerdown=event=>{if(!connected)return;event.preventDefault();typing.blur();video.setPointerCapture(event.pointerId);lastPoint=point(event);pendingMove=null;if(event.pointerType==='touch'){touchGestures.down(event);return}mouseDown=true;send({type:'button',button:event.button===2?2:0,down:true,...lastPoint})};
video.onpointermove=event=>{if(!connected)return;event.preventDefault();if(event.pointerType==='touch'){touchGestures.move(event);return}lastPoint=point(event);pendingMove={type:'move',...lastPoint}};
video.onpointerup=event=>{if(event.pointerType==='touch'){touchGestures.up(event);return}send({type:'button',button:event.button===2?2:0,down:false,...point(event)});mouseDown=false};video.onpointercancel=release;video.oncontextmenu=event=>event.preventDefault();video.onwheel=event=>{event.preventDefault();const multiplier=event.deltaMode===1?16:event.deltaMode===2?video.clientHeight:1;pendingWheel={type:'wheel',delta:Math.max(-1200,Math.min(1200,(pendingWheel?.delta||0)-event.deltaY*multiplier)),...point(event)}};
function moveLoop(){if(pendingMove){send(pendingMove,true);pendingMove=null}if(pendingWheel){send(pendingWheel);pendingWheel=null}requestAnimationFrame(moveLoop)}moveLoop();
window.addEventListener('blur',release);document.addEventListener('visibilitychange',()=>{if(document.hidden)release()});
document.getElementById('keyboard').onclick=()=>{const open=document.getElementById('keyboardbox').classList.toggle('open');document.getElementById('keyboard').textContent=open?'收起键盘':'打开键盘';if(open)typing.focus();else typing.blur()};
typing.addEventListener('compositionstart',()=>composing=true);typing.addEventListener('compositionend',event=>{composing=false;if(event.data)text(event.data);typing.value=''});
typing.addEventListener('input',event=>{if(composing||event.isComposing)return;if(typing.value)text(typing.value);typing.value=''});
typing.addEventListener('beforeinput',event=>{if(!composing&&event.inputType.startsWith('delete')){event.preventDefault();key(event.inputType.includes('Forward')?'Delete':'Backspace')}});
typing.addEventListener('keydown',event=>{
 if(composing||event.isComposing)return;
 if(['Enter','Tab','Escape','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(event.key)){
  event.preventDefault();key(event.key);
 }else if((event.ctrlKey||event.altKey||event.metaKey||held.size)&&event.key.length===1){
  event.preventDefault();
  const modifiers=[...held];
  if(event.ctrlKey)modifiers.push('Control');if(event.altKey)modifiers.push('Alt');if(event.metaKey)modifiers.push('Meta');if(event.shiftKey)modifiers.push('Shift');
  key(event.key,[...new Set(modifiers)]);
 }
});
document.querySelectorAll('[data-mod]').forEach(button=>button.onclick=()=>{const mod=button.dataset.mod;if(held.has(mod))held.delete(mod);else held.add(mod);button.setAttribute('aria-pressed',held.has(mod))});
const keys=['Escape','Tab','Enter','Backspace','Delete','Home','End','PageUp','PageDown','ArrowLeft','ArrowUp','ArrowDown','ArrowRight','Space',...Array.from({length:12},(_,i)=>'F'+(i+1))];const labels={Escape:'Esc',Backspace:'退格',Delete:'Del',ArrowLeft:'←',ArrowUp:'↑',ArrowDown:'↓',ArrowRight:'→',Space:'空格'};
for(const name of keys){const button=document.createElement('button');button.textContent=labels[name]||name;button.onclick=()=>key(name);document.getElementById('keys').appendChild(button)}
for(const [label,name,modifiers] of [['全选','a',['Control']],['复制','c',['Control']],['粘贴','v',['Control']],['剪切','x',['Control']],['撤销','z',['Control']],['切换窗口','Tab',['Alt']]]){const button=document.createElement('button');button.textContent=label;button.onclick=()=>key(name,modifiers);document.getElementById('keys').appendChild(button)}
document.getElementById('more').onclick=()=>document.getElementById('keys').classList.toggle('open');
document.getElementById('right').onclick=()=>{send({type:'move',...lastPoint});send({type:'button',button:2,down:true});send({type:'button',button:2,down:false})};
document.getElementById('escape').onclick=()=>key('Escape',[]);
document.getElementById('audio').onclick=async()=>{if(!connected){notice('请等待电脑连接');return}if(!desktopAudioAvailable){notice('电脑声音通道尚未就绪');return}video.muted=!video.muted;try{await video.play();document.getElementById('audio').textContent=video.muted?'声音':'静音'}catch{video.muted=true;notice('请再次点击声音开启播放')}};
document.getElementById('microphone').onclick=async()=>{if(microphoneStream){await microphoneSender.replaceTrack(null);microphoneStream.getTracks().forEach(track=>track.stop());microphoneStream=null;document.getElementById('microphone').setAttribute('aria-pressed','false');return}if(!connected){notice('请等待电脑连接');return}if(!microphoneReady){notice('电脑尚未配置虚拟麦克风，暂时无法送入 Codex');return}try{microphoneStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false});await microphoneSender.replaceTrack(microphoneStream.getAudioTracks()[0]);document.getElementById('microphone').setAttribute('aria-pressed','true')}catch(error){notice('麦克风未开启：'+error.message)}};
document.getElementById('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.body.requestFullscreen()}catch{statusEl.textContent='可将手机横屏放大'}};
document.getElementById('connect').onclick=connect;document.getElementById('stop').onclick=async()=>{intentional=true;clearTimeout(autoRetry);send({type:'disconnect'});await closeConnection();connecting=false;overlay.textContent='连接已断开';statusEl.textContent='已断开 · 重新连接可恢复'};
setInterval(async()=>{
 if(!pc||!connected)return;send({type:'ping',time:performance.now()},true);
 try{const report=await pc.getStats();let inbound,pair;report.forEach(value=>{if(value.type==='inbound-rtp'&&value.kind==='video')inbound=value;if(value.type==='candidate-pair'&&value.state==='succeeded'&&value.nominated)pair=value});if(!inbound)return;
  if(previousStats){const elapsed=(inbound.timestamp-previousStats.timestamp)/1000,frames=(inbound.framesDecoded-previousStats.framesDecoded)/elapsed;const emitted=(inbound.jitterBufferEmittedCount||0)-(previousStats.jitterBufferEmittedCount||0),buffer=emitted>0?1000*((inbound.jitterBufferDelay||0)-(previousStats.jitterBufferDelay||0))/emitted:0;const rtt=pair&&pair.currentRoundTripTime?pair.currentRoundTripTime*1000:pingRtt;const mbps=8*(inbound.bytesReceived-previousStats.bytesReceived)/elapsed/1e6;
   statsEl.textContent=(video.videoWidth?video.videoWidth+' × '+video.videoHeight+' · ':'')+'接收 '+Math.max(0,frames).toFixed(0)+' fps · 往返 '+rtt.toFixed(0)+' ms · 缓冲 '+buffer.toFixed(0)+' ms · '+mbps.toFixed(1)+' Mbps';if(frames>0){lastFrame=Date.now();overlay.textContent=''}if(lastFrame&&Date.now()-lastFrame>7000){overlay.textContent='视频暂时中断，正在恢复…'}
  }previousStats=inbound;
 }catch{}
},1000);
connect();
window.addEventListener('pageshow',event=>{if(event.persisted)location.reload()});
</script></body></html>
